name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
  run: |
    yes | sdkmanager --licenses >/dev/null 2>&1 || true
    sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # the web app lives in the repo root; copy it into the Android assets
      - name: Copy web app and icon
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          if [ -f icon.png ]; then
            rm -f android/app/src/main/res/drawable/app_icon.xml
            cp icon.png android/app/src/main/res/drawable/app_icon.png
          fi

      - name: Build APK
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/masir.jks"
            export KS_FILE="$RUNNER_TEMP/masir.jks"
            gradle -p android assembleRelease --no-daemon
          else
            gradle -p android assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: masir-apk
          path: android/app/build/outputs/apk/*/*.apk
